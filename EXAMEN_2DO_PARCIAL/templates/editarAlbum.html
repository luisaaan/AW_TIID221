<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Albums</title>
</head>
<body>

    <div>
        <h1>Album a editar</h1>

        <form action="/actualizar/{{ Album.0 }}" method="post">
            <input type="text" name="txtTitulo" value="{{ Album.1 }}">
            <input type="text" name="txtArtista" value="{{ Album.2 }}">
            <input type="text" name="txtAnio" value="{{ Album.3 }}">
            <input type="text" name="txtCalificacion" value="{{ Album.4 }}">
            <input type="text" name="txtResenia" value="{{ Album.5 }}">
            <button type="submit">Actualizar</button>
        </form>
    </div>
    
</body>
</html>
