<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Album</title>
</head>
<body>

    <div>
        <h1>Album a eliminar</h1>

        <form action="/eliminar/{{ Album.0 }}" method="post">
            <input type="text" name="txtTitulo" value="{{ Album.1 }}">
            <input type="text" name="txtArtista" value="{{ Album.2 }}">
            <input type="text" name="txtAnio" value="{{ Album.3 }}">
            <input type="text" name="txtCalificacion" value="{{ Album.4 }}">
            <input type="text" name="txtResenia" value="{{ Album.5 }}">
            <button type="submit" onclick="return Eliminar()">Eliminar</button>
            <button type="submit" onclick="Regresar()">Regresar</button>
        </form>

        <script>
            function Eliminar() {
                return confirm("¿Estás seguro de que deseas eliminar este album?");
            }

            function Regresar() {
                window.location.href = "{{ url_for('index') }}";
            }
    </div>
    
</body>
</html>
