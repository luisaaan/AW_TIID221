<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .contenedor{
            /*Dirección: vertucal u horizotal
            display: flex;
            flex-direction: row;*/
            display: grid;
            grid-template-columns: repeat(3, 1fr);
        }
        .card{
            width: 80px;
            padding: 20px;
            margin: 10px;
        }
        .card-larga{
            grid-column: 3;
            grid-row: span 3;

            display: flex;
            flex-direction: column;
            margin: 10px;
            
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <div class="card" style="background-color: steelblue;">CARD 1</div>
        <div class="card" style="background-color: beige;">CARD 2</div>
        <div class="card-larga" style="background-color: pink;">CARD 3</div>        
        <div class="card" style="background-color: rgb(144, 146, 238);">CARD 4</div>
        <div class="card" style="background-color: rgb(238, 144, 160);">CARD 5</div>
        <div class="card" style="background-color: rgb(236, 238, 144);">CARD 6</div>
        <div class="card" style="background-color: lightgreen;">CARD 7</div>
    </div>
</body>
</html>
