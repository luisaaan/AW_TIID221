{% extends "base.html" %}
{% block contenido %}
<div class="auth-card">
<div class="auth-brand"><div class="drop">♥</div><h2 class="text-xl font-bold">Banco de Sangre UPQ</h2><p class="text-sm">Dona hoy, salva vidas</p></div>
<h1 class="text-2xl font-bold mb-2">Registro de donante</h1><p class="text-sm text-gray-500 mb-5">Completa los datos para continuar.</p>
<form method="post"><label class="form-control"><span class="label-text mb-1">Nombre</span><input class="input input-bordered w-full" name="nombre" type="text" required></label><label class="form-control"><span class="label-text mb-1">Apellido paterno</span><input class="input input-bordered w-full" name="apellido_paterno" type="text" required></label><label class="form-control"><span class="label-text mb-1">Apellido materno</span><input class="input input-bordered w-full" name="apellido_materno" type="text" ></label><label class="form-control"><span class="label-text mb-1">Correo electrónico</span><input class="input input-bordered w-full" name="correo" type="email" required></label><label class="form-control"><span class="label-text mb-1">Contraseña</span><input class="input input-bordered w-full" name="contrasena" type="password" required></label><label class="form-control"><span class="label-text mb-1">Teléfono</span><input class="input input-bordered w-full" name="telefono" type="text" required></label><label class="form-control"><span class="label-text mb-1">Fecha de nacimiento</span><input class="input input-bordered w-full" name="fecha_nacimiento" type="date" required></label><label class="form-control"><span class="label-text">Sexo</span><select class="select select-bordered" name="sexo"><option>Femenino</option><option>Masculino</option><option>Otro</option></select></label><label class="form-control"><span class="label-text mb-1">CURP</span><input class="input input-bordered w-full" name="curp" type="text" required></label><label class="form-control"><span class="label-text mb-1">Domicilio</span><input class="input input-bordered w-full" name="domicilio" type="text" required></label><label class="form-control"><span class="label-text">Tipo de sangre</span><select name="tipo_sangre" class="select select-bordered"><option>A</option><option>B</option><option>AB</option><option>O</option></select></label><label class="form-control"><span class="label-text">Factor Rh</span><select name="factor_rh" class="select select-bordered"><option>+</option><option>-</option></select></label><button class="btn btn-primary w-full" type="submit">Registrarse</button></form><p class="text-center mt-4 text-sm"><a href="/login">Ya tienes cuenta? Inicia sesión</a></p>
</div>
{% endblock %}
